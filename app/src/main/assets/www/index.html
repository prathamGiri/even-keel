<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1A1C">
<meta name="color-scheme" content="dark">
<title>Even Keel</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="screens">
    <section class="screen" id="scr-home" data-tab="home"></section>
    <section class="screen" id="scr-payday" data-tab="payday" hidden></section>
    <section class="screen" id="scr-calendar" data-tab="calendar" hidden></section>
    <section class="screen" id="scr-settings" data-tab="settings" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-act="tab" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Home</span>
    </button>
    <button class="tab" data-act="tab" data-tab="payday" aria-label="Payday">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h4"/></svg><span>Payday</span><i class="dot" id="payDot" hidden></i>
    </button>
    <div class="fab-slot"><button class="fab" id="fab" data-act="add" aria-label="Add bill"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <button class="tab" data-act="tab" data-tab="calendar" aria-label="Calendar">
      <svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20v-5"/></svg><span>Calendar</span>
    </button>
    <button class="tab" data-act="tab" data-tab="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span>
    </button>
  </nav>

  <div class="page" id="detail" hidden></div>
  <div class="scrim" id="sheetScrim" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="scrim dlg-scrim" id="dlgScrim" hidden></div>
  <div class="dialog" id="dialog" hidden></div>
  <div class="onboard" id="onboard" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js"></script>
</body>
</html>
